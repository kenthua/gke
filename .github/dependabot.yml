version: 2
updates:
  # Python Components
  - package-ecosystem: "pip"
    directory: "/gclb/multi-path"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/workload/identity-platform/src/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/workload/identity-platform/src/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/workload/istio-multi/mainservice"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/workload/istio-multi/service1"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/workload/mysql-python-cloud-sql-proxy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Node.js Components
  - package-ecosystem: "npm"
    directory: "/workload/nodejs-trace"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
