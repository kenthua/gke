provider:
  gke:
    autopilot: true
inferenceExtension:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081
  replicas: 3
  image:
    # Image override for helm chart version 1.4 below
    hub: ghcr.io/llm-d
    name: llm-d-inference-scheduler
    # Image override for helm chart version 1.5 and above
    registry: ghcr.io
    repository: llm-d/llm-d-inference-scheduler
    tag: v0.8.0  
  #enableLeaderElection: true
  flags:
    v: 2
  failureMode: "FailOpen"
  monitoring:
    prometheus:
      enabled: true
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      memory: 16Gi
  sidecar:
    # CLI args for the Envoy sidecar. Override the chart's defaults of
    # `--log-level trace` (very expensive under load) and no `--concurrency`
    # (Envoy spawns ~hardware_concurrency() worker threads, oversubscribing
    # the cgroup's CPU slice). `--concurrency 8` matches the resources.limits
    # equivalent below; trace-level logging would burn a meaningful share of
    # the sidecar's CPU at high QPS.
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "8"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    # Resource requests and limits for the Envoy sidecar.
    resources:
      requests:
        cpu: "4"
        memory: 8Gi
      limits:
        memory: 16Gi
  tracing:
    otelExporterEndpoint: "http://localhost:4317"
    sampling:
      sampler: "parentbased_traceidratio"
      samplerArg: "0.1"        
  pluginsConfigFile: "plugins-v2-custom.yaml"
  pluginsCustomConfig:
    plugins-v2-custom.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      - type: prefix-cache-scorer
        parameters:
          hashBlockSize: 32
          maxPrefixBlocksToMatch: 64
          # (24GB - 1.5GB) / 128K = 175781
          # 175781 * 4 = 703125
          # 703125 / 64 = 10986
          lruCapacityPerServer: 10986
      - type: no-hit-lru-scorer
      schedulingProfiles:
      - name: default
        plugins:
        - pluginRef: queue-scorer
          weight: 2
        - pluginRef: kv-cache-utilization-scorer
          weight: 2
        - pluginRef: prefix-cache-scorer
          weight: 3
        - pluginRef: no-hit-lru-scorer
          weight: 2

inferencePool:
  modelServerProtocol: http
  modelServers:
    matchLabels:
      llm-d.ai/guide: "optimized-baseline"