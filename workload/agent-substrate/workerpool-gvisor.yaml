apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: gvisor-pool
  namespace: default
  labels:
    ate.dev/worker-pool: gvisor-pool
spec:
  replicas: 2
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
    - name: gvisor
  template:
    nodeSelector:
      cloud.google.com/compute-class: substrate-n2
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
