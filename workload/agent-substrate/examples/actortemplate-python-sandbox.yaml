# ActorTemplate for a Stateful Python Execution Sandbox running on MicroVM
# Supports:
#   - GET / or /healthz : Health check & list of active in-memory globals
#   - POST /execute     : Executes Python code in a persistent in-memory namespace
metadata:
  atespace: default
  name: python-sandbox-template
workerSelector:
  matchLabels:
    ate.dev/worker-pool: microvm-pool
containers:
- name: python-sandbox
  image: docker.io/library/python@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535
  command:
  - python3
  - -c
  - |
    import io, json, socket, sys, traceback
    from http.server import BaseHTTPRequestHandler, HTTPServer

    GLOBAL_NS = {"__name__": "__main__"}

    class SandboxHandler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            pass

        def do_GET(self):
            user_vars = [k for k in GLOBAL_NS.keys() if not k.startswith("_")]
            body = json.dumps({
                "status": "ok",
                "hostname": socket.gethostname(),
                "python_version": sys.version.split()[0],
                "active_variables": user_vars,
            }).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            raw = self.rfile.read(length).decode("utf-8") if length else ""
            try:
                payload = json.loads(raw) if raw else {}
                code = payload.get("code", raw) if isinstance(payload, dict) else str(payload)
            except Exception:
                code = raw

            stdout_buf, stderr_buf = io.StringIO(), io.StringIO()
            old_out, old_err = sys.stdout, sys.stderr
            exit_code = 0
            try:
                sys.stdout, sys.stderr = stdout_buf, stderr_buf
                exec(compile(code, "<sandbox>", "exec"), GLOBAL_NS, GLOBAL_NS)
            except SystemExit as e:
                exit_code = e.code if isinstance(e.code, int) else 1
            except BaseException:
                traceback.print_exc(file=stderr_buf)
                exit_code = 1
            finally:
                sys.stdout, sys.stderr = old_out, old_err

            resp = json.dumps({
                "stdout": stdout_buf.getvalue(),
                "stderr": stderr_buf.getvalue(),
                "exit_code": exit_code,
            }).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(resp)))
            self.end_headers()
            self.wfile.write(resp)

    HTTPServer(("0.0.0.0", 8080), SandboxHandler).serve_forever()
  wakeupProbe:
    httpGet:
      path: /
      port: 8080
    timeoutSeconds: 30
resources:
  limits:
    cpuMillicores: 500
    memoryBytes: 536870912 # 512 MiB RAM (fits within 960Mi worker capacity)
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
